<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#171613">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <title>Action Dice · Hunt &amp; Gather</title>
        <link rel="stylesheet" type="text/css" href="stylesheet.css">
        <script src="dice.js"></script>
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-inner">
                <p class="brand">Hunt &amp; Gather <span>Dice</span></p>
                <nav class="tabs">
                    <a href="index.html">Faces</a>
                    <a href="population.html">Population</a>
                    <a href="action.html" aria-current="page">Action</a>
                </nav>
            </div>
        </header>

        <main>
            <h1 class="page-title">Action Dice</h1>

            <section class="card">
                <h2>Dice pool</h2>
                <div id="setup"></div>
            </section>

            <section class="card">
                <h2>Result</h2>
                <p class="hint">Tap any number of dice to select them, then re-roll. One re-roll per roll.</p>
                <div id="results"></div>
            </section>

            <div class="actionbar">
                <button type="button" id="roll" class="btn btn-primary">Roll</button>
                <button type="button" id="reroll" class="btn btn-ghost" disabled>Re-roll selected</button>
            </div>
        </main>

        <script>
            createRoller({
                storageKey: "hg-action-counts",
                sections: [
                    { title: "White", keys: ["whiteLight", "whiteMedium", "whiteHeavy"], defaultCount: 0 },
                    { title: "Black", keys: ["blackLight", "blackMedium", "blackHeavy"], defaultCount: 0 }
                ]
            });
        </script>
    </body>
</html>
