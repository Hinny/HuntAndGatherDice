<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#171613">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <title>Hunt &amp; Gather Dice App</title>
        <link rel="stylesheet" type="text/css" href="stylesheet.css">
        <script src="dice.js"></script>
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-inner">
                <p class="brand">Hunt &amp; Gather <span>Dice</span></p>
                <nav class="tabs">
                    <a href="index.html" aria-current="page">Faces</a>
                    <a href="population.html">Population</a>
                    <a href="action.html">Action</a>
                </nav>
            </div>
        </header>

        <main>
            <h1 class="page-title">Dice Faces</h1>
            <p class="hint">Every face of every die in the box. Tap a die type to expand it.</p>

            <section id="faces-population">
                <h2 class="hint">Population dice</h2>
            </section>
            <section id="faces-white">
                <h2 class="hint">White action dice</h2>
            </section>
            <section id="faces-black">
                <h2 class="hint">Black action dice</h2>
            </section>
        </main>

        <script>
            renderFaceReference("faces-population", ["green", "blue", "red", "yellow"]);
            renderFaceReference("faces-white", ["whiteLight", "whiteMedium", "whiteHeavy"]);
            renderFaceReference("faces-black", ["blackLight", "blackMedium", "blackHeavy"]);
        </script>
    </body>
</html>
